version: '3.8'

services:
  macro-engine:
    image: macro-engine-local:latest
    container_name: frbus_structural_engine
    user: "1099:1099" # Matches the 'spark' user in your Dockerfile
    volumes:
      - ./:/home/spark           # Mounts current directory to container
      - ./data:/home/spark/data
      - ./results:/home/spark/results
      - ./models:/home/spark/models
    environment:
      - PYTHONPATH=/home/spark/.local/lib/python3.9/site-packages:/home/spark
    deploy:
      resources:
        limits:
          memory: 4G        # Enforces the 4GB ceiling
        reservations:
          memory: 2G        # Guarantees at least 2GB
    command: python3 src/engine.py
